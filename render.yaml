services:
  - type: web
    name: linkedin-autobrand-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_WHATSAPP_NUMBER
        value: "whatsapp:+919928215228"
