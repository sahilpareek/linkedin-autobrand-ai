name: LinkedIn 3x Daily AutoBrand Bot

on:
  schedule:
    # Mon–Fri Morning: 03:30 UTC = 09:00 IST (UI/UX + Pinterest/Dribbble style)
    - cron: '30 3 * * 1-5'
    # Mon–Fri Afternoon: 07:30 UTC = 13:00 IST (Website / web knowledge)
    - cron: '30 7 * * 1-5'
    # Mon–Fri Evening: 13:30 UTC = 19:00 IST (AI news / trending tech)
    - cron: '30 13 * * 1-5'
    # Sat & Sun 11:00 IST = 05:30 UTC (quiz / poll)
    - cron: '30 5 * * 0,6'
    # Sat & Sun 17:00 IST = 11:30 UTC (quiz / poll)
    - cron: '30 11 * * 0,6'

  workflow_dispatch:
    inputs:
      slot:
        description: 'Post Slot'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - afternoon
          - evening
          - weekend
      mode:
        description: 'Run Mode (Telegram draft only; LinkedIn needs Approve)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - post

jobs:
  run-slot-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LinkedIn Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          USER_WHATSAPP_NUMBER: ${{ secrets.USER_WHATSAPP_NUMBER }}
        run: |
          SLOT="${{ github.event.inputs.slot || 'auto' }}"
          MODE="${{ github.event.inputs.mode || 'preview' }}"
          python cli_auto_runner.py --slot $SLOT --mode $MODE
